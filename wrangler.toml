# =============================================================================
# Bangk-Shield — Cloudflare Workers configuration (v1)
# Dokumentasi lengkap opsi: https://developers.cloudflare.com/workers/wrangler/configuration/
# =============================================================================

name = "bangk-shield"
main = "src/index.js"
compatibility_date = "2026-01-01"

# -----------------------------------------------------------------------------
# ROUTING — pilih SALAH SATU cara Bangk-Shield "dipasang" di depan trafik asli:
# -----------------------------------------------------------------------------

# OPSI A (paling umum untuk honeypot): pasang Worker di depan situs yang sudah
# ada di zona Cloudflare Anda.
#
# routes = [
#   { pattern = "yourdomain.com/*", zone_name = "yourdomain.com" }
# ]

# OPSI B: deploy sebagai subdomain workers.dev bawaan untuk testing cepat
# (otomatis aktif kalau `routes` di atas dikosongkan, lalu `npm run deploy`).

# -----------------------------------------------------------------------------
# STATIC ASSETS (opsional) — isi HANYA jika Bangk-Shield juga serve aset
# statis situsnya sendiri. Kalau Bangk-Shield murni "penjaga di depan" origin
# terpisah, pakai ORIGIN_URL di bagian [vars] di bawah, bukan ini.
# -----------------------------------------------------------------------------

# [assets]
# directory = "./public"
# binding = "ASSETS"

# -----------------------------------------------------------------------------
# WORKERS KV — WAJIB untuk fitur v1 berikut (bukan lagi opsional seperti draft
# sebelumnya):
#   - Circuit breaker (src/ratelimit.js) -> key "strike:<ip>"
#   - Watermark salt rotation (src/watermark.js) -> key "wm:salt:current" & "wm:salt:history"
# Tanpa binding ini, kedua fitur fail-open (tidak memblokir apapun / salt jatuh
# ke fallback dev), tapi TIDAK direkomendasikan untuk deploy produksi.
#
# Buat namespace dulu: `npx wrangler kv namespace create BANGK_KV`
# lalu isi "id" di bawah dengan output dari perintah tersebut.
# -----------------------------------------------------------------------------

[[kv_namespaces]]
binding = "BANGK_KV"
id = "isi-dengan-id-kv-namespace-anda"

# -----------------------------------------------------------------------------
# WORKERS ANALYTICS ENGINE — dipakai src/logger.js untuk logging best-effort.
# Tanpa ini, event serangan TIDAK tercatat sama sekali (logger.js langsung
# return kalau binding tidak ada -- lihat catatan di README §Known Limitations).
# Aktifkan dulu Analytics Engine di dashboard Cloudflare akun Anda.
# -----------------------------------------------------------------------------

[[analytics_engine_datasets]]
binding = "BANGK_ANALYTICS"
dataset = "bangk_shield_events"

# -----------------------------------------------------------------------------
# ENVIRONMENT VARIABLES
# -----------------------------------------------------------------------------

[vars]
# URL origin asli untuk trafik legit (WAJIB diisi kalau tidak pakai [assets]).
# Tanpa ini, passthrough() tidak akan fetch apapun -- lihat catatan penting
# di src/utils.js soal kenapa fetch(request) mentah berbahaya (infinite loop).
ORIGIN_URL = ""

# Fallback watermark salt HANYA untuk dev lokal tanpa BANGK_KV. Di produksi,
# salt sesungguhnya datang dari KV key "wm:salt:current" (lihat src/watermark.js)
# dan dikelola lewat `npm run salt:rotate` -- JANGAN andalkan env var ini di prod.
WATERMARK_SALT = "dev-only-change-me"

# Segmen path admin dashboard (lihat PRD §3.7). CATATAN: dashboard-nya sendiri
# BELUM diimplementasikan di v1 ini -- lihat README §Known Limitations.
# ADMIN_PATH = ""