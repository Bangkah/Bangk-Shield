name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build rules & run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Fail-closed by design (PRD Beta bagian 5): kalau config/rules.json tidak lolos
      # schema validation, ReDoS lint, atau case-sensitivity lint, job ini berhenti
      # di sini -- tidak ada artefak rusak yang lanjut ke test atau deploy.
      - name: Build rules (schema validation + ReDoS lint + case-sensitivity lint)
        run: npm run build:rules

      # Test scanner (skenario deteksi: path traversal, combo bonus, SQLi ter-encode,
      # trafik legit) dan watermark (format bagian 3.4.1, bentuk data KV, fallback salt).
      - name: Run tests
        run: npm test

      - name: Upload compiled rules artifact
        uses: actions/upload-artifact@v4
        with:
          name: rules-compiled
          path: src/rules.compiled.json
          retention-days: 7
