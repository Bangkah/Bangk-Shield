name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-rules:
    name: Build rules
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build rules
        run: npm run build:rules

      - name: Upload compiled rules
        uses: actions/upload-artifact@v4
        with:
          name: rules-compiled
          path: src/rules.compiled.json
          if-no-files-found: error
          retention-days: 7
