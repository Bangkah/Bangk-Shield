name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build rules & run tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fail-closed by design:
      # - config/rules.json schema validation
      # - ReDoS lint
      # - case-sensitivity lint
      #
      # Jika rules tidak valid, workflow berhenti di sini dan
      # tidak menghasilkan artifact rules yang tidak tervalidasi.
      - name: Build rules
        run: npm run build:rules

      # Menjalankan seluruh test suite setelah rules berhasil
      # dikompilasi dan divalidasi.
      - name: Run tests
        run: npm test

      # Artifact hanya dibuat setelah build rules dan test berhasil.
      - name: Upload compiled rules
        uses: actions/upload-artifact@v4
        with:
          name: rules-compiled
          path: src/rules.compiled.json
          if-no-files-found: error
          retention-days: 7
